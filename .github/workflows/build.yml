name: build

# Релиз: поставь тег вида v0.5.1 (версия должна совпасть с tauri.conf.json и src-tauri/Cargo.toml) и запушь его.
# Ручной запуск (Actions → build → Run workflow) собирает установщик без публикации релиза.
# Секреты (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           — содержимое приватного ключа подписи обновлений (файл .key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — пароль ключа (может быть пустым, если ключ создан без пароля)
#   VILAUNCHER_MS_CLIENT_ID             — необязательно (вход через Microsoft не используется)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:frontend
      - run: node scripts/check-config.mjs
      - run: npm run test:ui
      - run: cargo test -p vilauncher-core -p vilauncher-manifest

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      VILAUNCHER_MS_CLIENT_ID: ${{ secrets.VILAUNCHER_MS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Ранняя и понятная ошибка вместо «загадочного» падения сборки
      - name: Проверка ключа подписи
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Не задан секрет TAURI_SIGNING_PRIVATE_KEY. См. BUILD.md, раздел «Ключи подписи обновлений»."
          }
      - name: Проверка конфигурации (CSP, права, публичный ключ, версия)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          if ($tag) { node scripts/check-config.mjs --release --tag $tag } else { node scripts/check-config.mjs --release }

      # Программа для манифестов: vilauncher-manifest.exe
      - run: cargo build --release -p vilauncher-manifest

      # Релиз по тегу: NSIS-установщик + .sig + latest.json (для tauri-plugin-updater) в GitHub Releases
      - uses: tauri-apps/tauri-action@v0
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: ViLauncher ${{ github.ref_name }}
          releaseBody: "Установщик ViLauncher. Лаунчер обновляется сам (подписанные обновления)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Приложить программу манифеста к релизу
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: target/release/vilauncher-manifest.exe

      # Ручной запуск: просто собрать и положить артефакты
      - run: npm run tauri:build
        if: github.ref_type != 'tag'
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: vilauncher-windows
          path: |
            target/release/bundle/nsis/*
            target/release/vilauncher-manifest.exe
