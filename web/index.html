<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViLauncher — Официальный сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка / Главный экран -->
    <header class="hero">
        <div class="container">
            <h1>ViLauncher</h1>
            <p>Ваш комфортный вход на Minecraft сервер</p>
            
            <div class="download-box">
                <a id="download-btn" href="#" class="btn primary">Загрузка...</a>
                <span id="version-tag" class="version-tag">Версия: ...</span>
            </div>
        </div>
    </header>

    <!-- Раздел новостей -->
    <main class="container">
        <h2>Последние новости</h2>
        <div id="news-container" class="news-grid">
            <p>Загрузка новостей...</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 ViLauncher. Hosted on GitHub Pages.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
