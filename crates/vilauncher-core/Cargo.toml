[package]
name = "vilauncher-core"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "ViLauncher backend core: delta downloads, secure token storage, portable JRE"

[dependencies]
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process", "net"] }
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
sha1         = "0.10"
sha2         = "0.10"
md-5         = "0.10"
hex          = "0.4"
base64       = "0.22"
zip          = { version = "0.6", default-features = false, features = ["deflate"] }
flate2       = "1"
tar          = "0.4"
keyring      = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }
log          = "0.4"
toml         = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
vilauncher-manifest = { path = "../../tools/vilauncher-manifest" }
